app = 'downtube-bot'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  [[services.ports]]
    port = 80
  [[services.ports]]
    port = 443

[vm]
  size = 'shared-cpu-1x'
